[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-trello"
version = "1.0.0"
description = "Servidor MCP somente leitura para boards, cards, comentários e metadados de anexos do Trello."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Wendell Barreto" }]
dependencies = [
    "fastmcp==2.11.3",
    "httpx==0.28.1",
    "python-dotenv==1.1.1",
    "pydantic==2.11.7",
    "uvicorn==0.35.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_trello"]
